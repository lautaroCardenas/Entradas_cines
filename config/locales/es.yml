      status: { now_showing: En cartelera, coming_soon: Próximamente, archived: Archivada }
    screening:
      screen_format: { two_d: 2D, three_d: 3D, imax: IMAX }
      language: { dubbed: Doblada, subtitled: Subtitulada }
